name: Release

# Push a tag to cut a release:
#   git tag v0.2.0 && git push origin v0.2.0
# A tag with a suffix (v0.2.0-rc.1) is published as a pre-release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Test
        run: |
          go vet ./...
          go test ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. A token that can push to bowd/homebrew-tap. Without it the Homebrew cask is skipped.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # Installs the release that was just published the way a user would, on each supported OS.
  smoke:
    name: Install on ${{ matrix.os }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run install.sh
        env:
          LIVERY_VERSION: ${{ github.ref_name }}
          LIVERY_REPO: ${{ github.repository }}
          LIVERY_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh install.sh
          "${LIVERY_INSTALL_DIR}/liv" version | grep -F "${LIVERY_VERSION#v}"
